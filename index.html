```html
<!DOCTYPE html>
<html>
<head>
    <title>College Application Form</title>
</head>

<body>

    <h1 align="center">College Application Form</h1>

    <form>

        <fieldset>
            <legend><b>Personal Details</b></legend>

            <label>Full Name:</label>
            <input type="text" name="name" placeholder="Enter your name" required>
            <br><br>

            <label>Date of Birth:</label>
            <input type="date" name="dob" required>
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
            <br><br>

            <label>Nationality:</label>
            <input type="text" name="nationality" value="Indian">
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>Contact Details</b></legend>

            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter email" required>
            <br><br>

            <label>Phone Number:</label>
            <input type="tel" name="phone" placeholder="Enter phone number" required>
            <br><br>

            <label>Address:</label><br>
            <textarea name="address" rows="4" cols="40"
                      placeholder="Enter your address"></textarea>
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>Academic Details</b></legend>

            <label>10th Mark:</label>
            <input type="number" name="tenth" placeholder="Enter marks">
            <br><br>

            <label>12th Mark:</label>
            <input type="number" name="twelfth" placeholder="Enter marks">
            <br><br>

            <label>Course:</label>
            <select name="course">
                <option value="">-- Select Course --</option>
                <option>B.E Computer Science Engineering</option>
                <option>B.Tech Artificial Intelligence</option>
                <option>B.Sc Computer Science</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>B.Com</option>
            </select>
            <br><br>

            <label>Preferred Department:</label>
            <select name="department">
                <option>CSE</option>
                <option>AI & DS</option>
                <option>IT</option>
                <option>ECE</option>
                <option>MECH</option>
            </select>
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>Other Details</b></legend>

            <label>Upload Photo:</label>
            <input type="file" name="photo">
            <br><br>

            <label>Hobbies:</label><br>
            <input type="checkbox" name="hobby" value="sports"> Sports
            <input type="checkbox" name="hobby" value="music"> Music
            <input type="checkbox" name="hobby" value="reading"> Reading
            <input type="checkbox" name="hobby" value="coding"> Coding
            <br><br>

            <label>Why do you want to join this college?</label><br>
            <textarea name="reason" rows="4" cols="50"
                      placeholder="Enter your reason"></textarea>
            <br><br>

        </fieldset>

        <br>

        <input type="checkbox" required>
        I declare that the information provided above is correct.
        <br><br>

        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
```
